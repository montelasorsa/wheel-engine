project:
  name: wheel-screener
  component: A

# Absolute on purpose. The repo moved out of the iCloud tree to
# ~/Developer/wheel-engine, so the sibling-relative paths this file used to
# carry now resolve next to the repo instead of next to the governance docs.
paths:
  governance: /Users/montelasorsa/Documents/Projects/Active/The Wheel/WheelGovernance/
  research: /Users/montelasorsa/Documents/Projects/Active/The Wheel/Research/
  # AGENTS.md §3: operational data lives in the repo SIBLING, never the repo.
  wheelops: /Users/montelasorsa/Developer/WheelOps/
  # One-way backup destination (commands/wheel-backup). WheelOps is the
  # source of truth; this only ever receives copies.
  backup: /Users/montelasorsa/Library/Mobile Documents/com~apple~CloudDocs/AdVenture Labs/WheelOps-backup/

# ST-SEL-07 / AL-SEL-06: the screener surfaces candidates from a broad
# universe rather than ranking a hand-picked list. The CBOE equity options
# symbol directory enumerates every name CBOE lists options on (~5,300),
# published daily -- the closest free answer to "what is optionable", which is
# the question that matters, since a name without options cannot be wheeled.
# Enumeration, NOT a quality filter: the screener's own rules do the filtering.
universe:
  source: cboe_equity_options
  market_cap_floor: 2_000_000_000
  price_floor: 10
  include: [SPY, QQQ]
  exclude: []
  etf_exclude_patterns: ["2x", "3x", "Ultra", "Inverse", "Bear", "Short", "ProShares", "Direxion", "Single"]

# Behavior only -- never secrets. The FMP API key is loaded from .env; see
# .env.example for the tracked template. An API key must not appear in
# config.yaml, in this file, or in any other tracked file.
data_sources:
  yfinance:
    # Global pacing applies even if a future caller uses multiple workers.
    min_request_interval_seconds: 0.15
    max_attempts: 3
    initial_backoff_seconds: 2.0
    backoff_multiplier: 2.0

providers:
  # FMP free plan lacks TTM statement endpoints. Enable when upgraded.
  fmp_enabled: false

# Composite weights total 1.00 and apply only after hard gates pass. Each key
# names a continuous 0-100 curve in wheel/scorers.py, not a pass/fail bucket.
# Equal to start: the weighting is the last thing to tune, after a ranked run
# shows which components actually separate names.
weights:
  volatility: 0.20          # ST-SEL-10, inverse -- lower vol ranks higher
  chart_position: 0.20      # ST-SEL-12, distance below the two-year high
  cash_flow_strength: 0.20  # ST-SEL-01, operating cash flow / revenue
  dividend: 0.20            # ST-SEL-06, yield; its weight is what caps it
  analyst_strength: 0.20    # ST-SEL-02, on the 1-5 recommendation mean

thresholds:
  profitability:
    # F1 / ST-SEL-01
    min_ttm_net_income: 0
    min_operating_cash_flow: 0

  analyst:
    # F2 / ST-SEL-02; 1=strong buy, 5=sell.
    max_mean_rating: 2.5

  price:
    # F3-F4 / ST-SEL-03, ST-SEL-04, ST-SEL-13
    min_usd: 10.0
    max_usd: 50.0
    pilot_bias_max_usd: 30.0

  stability:
    # F5 / ST-SEL-05
    history_days: 365
    max_single_day_move: 0.15
    max_realized_vol_universe_percentile: 0.75

  iv_proxy:
    # F7 / ST-SEL-10, ST-SEL-11. This is realized volatility, not IV.
    lookback_trading_days: 30
    annualization_trading_days: 252
    quality_zone_min: 0.20
    quality_zone_max: 0.40
    high_vol_penalty_above: 0.50

  chart_position:
    # F8 / ST-SEL-12
    history_days: 730
    min_below_two_year_high: 0.05

  earnings:
    # F10 / ST-ENT-05; flag only, never disqualify.
    flag_within_days: 45

# ---------------------------------------------------------------------------
# Wheel Engine v2 (AGENTS.md §3): operational sibling folder + operator state.
# config.yaml is LOCAL and gitignored; config/example.yaml is the template.
# ---------------------------------------------------------------------------

# ST-SEL-07: the operator's watchlist (~10 names, reviewed every few weeks).
# Operator-edited. Tickers are never hardcoded in code.

# The monitored tier is the operator's working watchlist (ST-SEL-07),
# produced by the screener rather than fed into it.
monitored:
  floor_score: 60
  max_per_zone: 5
  total_cap: 25

account:
  # AL-SEL-02 inputs. No broker link at pilot -- operator-maintained.
  # Constitution §11.2 uses $12,000 as the pilot working figure.
  net_liq: 12000
  # Interim pilot cap. The 5% policy (§11.1) is openly suspended at pilot
  # scale (§11.2); 0.25 puts the zone ceiling at $30 on a $12K account,
  # matching the pilot-bias band. Tighten toward 0.05 as the account grows.
  per_name_cap: 0.25
